name: CI

# 2026-05-20: push/pull_request triggers were removed to stop GitHub Actions
# billing; CI/CD moved to the local pre-push hook (.githooks/pre-push) +
# scripts/local-ci.sh.
# 2026-06-24: re-enabled on push-to-main + pull_request as the server-side
# gate for the autonomous loop (.claude/loop-spec.md) while there is no
# self-hosted Proxmox runner yet. Jobs are already ubuntu-only + single
# Python, so per-push cost is bounded; the heavy security sweep stays weekly
# in security.yml. The local pre-push hook still mirrors these gates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Without this, every job inherits the repository's
# default workflow permissions, which may be read-write. Jobs that need more opt
# in explicitly (see `microbench`, which posts a PR comment).
permissions:
  contents: read

# concurrency still useful for the manual-dispatch case (e.g. user
# kicks "Run workflow" twice in quick succession), even though the
# main push-burst use case is gone.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force Node 24 for all JavaScript actions so the deprecation banner
# (Node 20 removal scheduled 2026-09-16) doesn't fire on every run.
# Safe opt-in per the GitHub Blog post — actions either expose a Node 24
# build (newer versions) or fall back to Node 20 if they don't yet,
# without crashing. Documented in:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-host:
    name: Python host (mypy + pytest)
    strategy:
      fail-fast: false
      matrix:
        # macos-latest dropped: libvirt-python wheel build hung 6h on a
        # cold runner (no libvirt headers via Homebrew without an extra
        # provisioning step). Local pre-push hook + scripts/local-ci.sh
        # cover the same gates against developers' actual machines.
        os: [ubuntu-latest]
        # 3.9 is dropped from CI: mypy 2.1+ (dev extra) requires 3.10+,
        # so the install step itself fails on 3.9 before any check runs.
        # `requires-python = ">=3.9"` in pyproject is the runtime floor
        # for end-users; bumping it is a user decision (public API).
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (mock + dev extras; skip linux-only on macOS)
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            # libsystemd-dev is required by `systemd-python` (compiled
            # from sdist on the runner), libvirt-dev by `libvirt-python`.
            sudo apt-get install -y libvirt-dev libsystemd-dev pkg-config
            pip install -e ".[mock,dev,linux]"
          else
            pip install -e ".[mock,dev]"
          fi
      - name: ruff check
        # Bans `print()` (T201) per DEC-0006; backstop pycodestyle/
        # pyflakes/isort. Generated proto modules excluded via
        # pyproject `extend-exclude`. tests/ included since audit
        # 2026-06-12 hit 0 findings — ratchet floor.
        run: ruff check src/ tests/
      - name: mypy --strict
        # Verified locally on macOS Python 3.12: 0 issues across 32 source
        # files (commit 58dad5f). Enforced rather than tolerated.
        run: mypy --strict src/
      - name: enforce production code does not import mocks
        # Per FOLLOWUPS:269 — production paths cannot reach into
        # *.mock modules. Whitelist below documents the three
        # legitimate sites (library-API re-exports + the Phase 3
        # dev-default in daemon.py); any new bad import fails CI.
        run: |
          bad=$(grep -rE "from crossdesk_host\\.[^[:space:]]+\\.mock import" src/ \
                | grep -v "src/crossdesk_host/integrations/keyring/__init__\\.py:" \
                | grep -v "src/crossdesk_host/filesystem_ctl/__init__\\.py:" \
                | grep -v "src/crossdesk_host/daemon\\.py:" \
                || true)
          if [ -n "$bad" ]; then
            echo "❌ production code imports a mock module outside the whitelist:"
            echo "$bad"
            echo
            echo "Either: route through the real impl, expose via an"
            echo "abstraction Protocol, or extend the whitelist with a"
            echo "matching FOLLOWUPS line explaining why."
            exit 1
          fi
      - name: pytest
        # --cov arms the fail_under ratchet floor in pyproject.toml
        # [tool.coverage.report] (audit 2026-06-12).
        run: pytest -q --cov=crossdesk_host --cov-report=term

  rust-guest-cross-compile:
    name: Rust guest (cargo check + test on host arch)
    strategy:
      fail-fast: false
      matrix:
        # macos-latest dropped: cross-compile via MinGW (homebrew) is
        # consistently slower and occasionally fails on link-step
        # symbols not present in macOS's mingw-w64. Ubuntu cross-compile
        # is the canonical path; macOS devs use scripts/local-ci.sh.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install MinGW (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Install MinGW (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install mingw-w64
      - name: cargo check (Windows target)
        working-directory: guest
        run: cargo check --workspace --target x86_64-pc-windows-gnu
      - name: cargo test (host arch, mock feature where defined)
        working-directory: guest
        # `--features mock` enables mock implementations in crates that
        # define the feature (currently ipc-vsock; others to follow per
        # docs/CROSS_PLATFORM_DEV.md). Cargo silently ignores the flag
        # for crates without the feature, so the workspace builds fine.
        run: cargo test --workspace --features ipc-vsock/mock
      - name: cargo clippy
        working-directory: guest
        # Verified locally on macOS (commit on feat/initial-ci-green):
        # 0 warnings on x86_64-pc-windows-gnu after the cross-compile
        # warning cleanup. Enforced rather than tolerated.
        run: cargo clippy --workspace --target x86_64-pc-windows-gnu -- -D warnings

  rust-gui:
    name: Rust GUI (cargo check + qmllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools cmake ninja-build
      - name: cargo check
        working-directory: gui
        # Verified locally on macOS Apple Silicon — `cargo check --workspace`
        # green after cxx-qt 0.7 deps resolved. Linux runner needs the
        # Qt6 packages above; if dpkg names drift on a future Ubuntu image
        # we'll reintroduce continue-on-error and track in FOLLOWUPS.
        run: cargo check --workspace
      - name: qmllint
        working-directory: gui
        # Reads gui/.qmllint.ini for the warning-level overrides
        # (CXX-Qt-registered types are invisible to qmllint, and the
        # Quick.LayoutsPositioning tech-debt is tracked in FOLLOWUPS).
        # No -W flag: qmllint < 6.5 (Ubuntu 24.04 ships 6.4.2) rejects
        # it as unknown. Errors still fail the step; warnings surface
        # as text. Flip on -W 0 once the runner pulls Qt 6.5+.
        #
        # continue-on-error: Qt 6.4.2 on the GH runner is flaky against
        # CXX-Qt-registered types; until the runner pulls 6.5+, treat
        # this as advisory. Local pre-push hook (.githooks/pre-push)
        # runs qmllint with the same .qmllint.ini and IS HARD-FAIL on
        # developer machines that have Qt 6.5+.
        continue-on-error: true
        run: |
          find crates/crossdesk-gui/qml -name '*.qml' -print0 \
            | xargs -0 -n 1 /usr/lib/qt6/bin/qmllint

  proto:
    name: Proto lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - name: buf lint
        working-directory: proto
        # Rules codified in proto/buf.yaml (STANDARD minus COMMENT_*).
        # Strict-enforced.
        run: buf lint
      - name: buf format check
        working-directory: proto
        # Diff-and-fail on any unformatted file. Run `buf format -w`
        # locally to normalise.
        run: buf format --diff --exit-code

  microbench:
    name: Microbench gate (N1.* perf regression check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR-comment posting needs write access to the PR; reads stay default.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mock,dev]"
      - name: Run microbenchmarks
        working-directory: host
        # --benchmark-only: skip regular tests, run bench functions only.
        # --benchmark-json: emit machine-readable output for bench_check.py.
        # -q: suppress per-test output — the JSON file is the artefact.
        run: |
          python -m pytest benches/ \
            --benchmark-only \
            --benchmark-json=bench-results.json \
            -q
      - name: Check perf regression
        # bench_check.py exits 1 if any baseline-gated metric regresses by
        # >20%. 0-baseline entries are informational (collect-only) and
        # never fail. The baselines file is the single source of truth;
        # updates require a dedicated perf: PR.
        run: |
          python scripts/bench_check.py \
            --baseline .github/perf-baselines.json \
            --results host/bench-results.json
      - name: Render bench report
        # Always render (cheap) so the artefact is available for inspection
        # even on push-to-main runs; the comment-posting step below is the
        # one gated on event_name.
        if: always()
        run: |
          python scripts/bench_report.py \
            --baseline .github/perf-baselines.json \
            --results host/bench-results.json \
            --output bench-report.md
      - name: Post bench report as PR comment
        # PR-only: pushes to main have no PR to comment on. `always()` so
        # we still post the report even when bench_check failed — that's
        # exactly when reviewers most want to see the table.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file bench-report.md

  i18n-extract:
    name: i18n string extraction check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt linguist tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qttools5-dev-tools gettext
      - name: Install host dependencies (for xgettext to find imports)
        working-directory: host
        run: pip install -e ".[mock]" --quiet
      - name: Re-extract strings
        run: bash scripts/i18n.sh extract
      - name: Check .pot for uncommitted changes
        # Fails if xgettext produced new msgid entries not in the committed
        # .pot — signals that a developer added _("...") but didn't commit
        # the updated template.  Ignores POT-Creation-Date (frozen in
        # scripts/i18n.sh) and line-number comments which shift on
        # every reformat.
        #
        # continue-on-error: pre-push hook (.githooks/pre-push) catches
        # this on developer machines (HARD FAIL when xgettext present).
        # CI advisory only to avoid blocking merges on a recoverable
        # one-line follow-up commit.
        continue-on-error: true
        run: |
          git diff --exit-code i18n/crossdesk-host.pot \
            || { echo "ERROR: i18n/crossdesk-host.pot has uncommitted changes."; \
                 echo "Run 'bash scripts/i18n.sh extract' and commit the result."; \
                 exit 1; }
      - name: Check Qt .ts for uncommitted changes
        continue-on-error: true
        run: |
          git diff --exit-code \
            gui/crates/crossdesk-gui/i18n/crossdesk_en.ts \
            gui/crates/crossdesk-gui/i18n/crossdesk_pl.ts \
            || { echo "ERROR: Qt .ts files have uncommitted changes."; \
                 echo "Run 'bash scripts/i18n.sh extract' and commit the result."; \
                 exit 1; }

  linux-kvm-smoke:
    name: Linux + KVM smoke (self-hosted)
    # Hardware-bound suite (real libvirt + /dev/kvm), opt-in via the
    # 'hardware-smoke' PR label. Runs on the self-hosted Proxmox/KVM runner
    # (registered with labels: self-hosted, linux, kvm). The runner stand-up
    # is tracked separately (A1-standup); until a matching runner registers, a
    # labeled PR's job simply queues — it never blocks the other checks. Once
    # the runner is permanently online, add `github.event_name == 'push'` to
    # the `if:` below to also smoke every push to main.
    # Same-repo guard: a fork PR must NEVER reach the self-hosted runner (it
    # would run untrusted PR code on our hardware) even if a collaborator
    # mislabels it — the head repo must be this repo (pwn-request guard).
    if: >-
      contains(github.event.pull_request.labels.*.name, 'hardware-smoke') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: KVM + libvirt preflight
        run: |
          test -e /dev/kvm || { echo "::error::self-hosted runner is missing /dev/kvm"; exit 1; }
          virsh -c qemu:///session version
      - name: Install host (linux extra)
        run: |
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[mock,dev,linux]"
      - name: doctor (informational)
        run: |
          . .ci-venv/bin/activate
          crossdesk doctor || true
      - name: linux_only tests
        run: |
          . .ci-venv/bin/activate
          pytest -m linux_only -v --timeout=900 --timeout-method=signal
