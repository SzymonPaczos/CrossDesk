name: Security audit

# 2026-05-20: automatic triggers were REMOVED to stop GitHub Actions billing.
# 2026-07-14: RESTORED (owner sign-off — needs-owner.md §8). The repo is public,
# so Actions minutes are free, and AGENTS.md has claimed all along that this
# sweep "runs on every push, every PR, and weekly on Mondays" — it now actually
# does, instead of the claim being a lie.
#
# scripts/local-security.sh still mirrors the gitleaks / pip-audit / bandit /
# cargo-audit / cargo-deny half on the developer's machine; semgrep + CodeQL are
# GitHub-hosted-only. SARIF findings upload to the Security tab either way.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC — off-the-hour to dodge the top-of-hour cron stampede.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Same coalescing pattern as ci.yml. The weekly scheduled run gets
# its own ref (`schedule`) so it isn't cancelled by push-driven runs.
concurrency:
  group: sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top: security-events: write used to be granted to every
# job here, including ones that only run a scanner. The two jobs that actually
# upload SARIF opt into it themselves.
permissions:
  contents: read

# Force Node 24 for JS actions — see same comment in ci.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # gitleaks scans full history
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    name: Python security (pip-audit + bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # bandit SARIF upload
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Install host package + dev extras
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev libsystemd-dev pkg-config
          pip install -e ".[mock,dev,linux]"
      - name: pip-audit
        # No --strict: it treats unaudited deps as fatal, and our own
        # editable `crossdesk-host` install is unaudited by definition
        # (not published to PyPI). pip-audit still exits non-zero on
        # any *real* advisory hit against our third-party deps.
        run: pip-audit
      - name: bandit (SARIF)
        run: |
          pip install bandit-sarif-formatter
          bandit -r src/crossdesk_host -ll \
            -f sarif -o ../bandit.sarif || true
      - name: Upload bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  rust-security:
    name: Rust security (cargo audit + cargo deny)
    strategy:
      fail-fast: false
      matrix:
        workspace: [guest, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Qt6 (gui workspace)
        if: matrix.workspace == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev cmake ninja-build
      - name: Install scanners
        run: |
          cargo install --quiet cargo-audit cargo-deny
      - name: cargo audit
        working-directory: ${{ matrix.workspace }}
        run: cargo audit --deny warnings
      - name: cargo deny
        working-directory: ${{ matrix.workspace }}
        run: cargo deny check --hide-inclusion-graph

  semgrep:
    name: Multi-language static analysis (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # semgrep SARIF upload
    container:
      # Digest-pinned. A floating `latest` on a container that reads the whole
      # repo is the same movable-supply-chain risk as an unpinned action.
      image: semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e # latest, pushed 2026-07-08
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: semgrep ci → SARIF
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/python
            p/rust
            p/secrets
            p/owasp-top-ten
        run: |
          semgrep ci --sarif --output semgrep.sarif || true
      - name: Upload semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  workflows:
    name: Workflow static analysis (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # zizmor SARIF upload
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zizmor
        # Version-pinned so "clean" means the same thing here and on a dev box.
        run: pip install zizmor==1.27.0
      - name: zizmor → SARIF
        # Informational findings (style nits like superfluous-actions) surface in
        # the Security tab without blocking anyone.
        run: zizmor --no-progress --format sarif .github/workflows/ > zizmor.sarif
      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Gate — zero findings at low severity and above
        # The ratchet (.claude/rules/rules-as-gates.md): 05653c7 took this tree
        # from 42 high findings to zero and .github/zizmor.yml froze the pinning
        # convention. Blocking here is what keeps that a floor instead of a
        # one-off cleanup — a new unpinned third-party action fails the build.
        # Informational is excluded deliberately: it is code smell, not risk.
        run: zizmor --no-progress --min-severity=low .github/workflows/

  codeql:
    name: GitHub CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      # CodeQL auto-builds Python; no manual build step needed.
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
