[package]
name    = "observability"
version = "0.1.0"
edition = "2021"

license.workspace = true
repository.workspace = true
[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
rand = "0.9"
# serde removed 2026-05-20 audit cleanup: only `serde_json::Value` was
# touched, which pulls serde transitively. Re-add the direct dep when
# we start deriving Serialize/Deserialize on observability types.
serde_json = "1"
# Per DEC-0006 §2 + §6: `tracing-opentelemetry` bridges our `tracing`
# spans to OpenTelemetry. The OTLP exporter itself is opt-in: it
# only initialises when `OTEL_EXPORTER_OTLP_ENDPOINT` is set
# (DEC-0002 — zero telemetry by default).
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

[lints]
workspace = true
