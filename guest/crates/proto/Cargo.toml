[package]
name    = "proto"
version = "0.1.0"
edition = "2021"

license.workspace = true
repository.workspace = true

# prost + prost-types are consumed by the *generated* code that
# tonic-build emits into $OUT_DIR; cargo-machete can't see those files
# so it reports the deps as unused. Whitelist for honest audits.
[package.metadata.cargo-machete]
ignored = ["prost", "prost-types"]

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[build-dependencies]
tonic-build = "0.14"
# Vendored protoc avoids requiring `protoc` on PATH inside cross-rs
# build images (which ship without it) and on dev hosts that haven't
# installed it system-wide.
protoc-bin-vendored = "3"

[lints]
workspace = true
