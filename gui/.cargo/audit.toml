# cargo-audit configuration for the gui workspace.
#
# Deliberately diverges from guest/deny.toml: the gui workspace pulls
# Qt6/cxx-qt, not tonic, so it has NO rustls-pemfile transitive dep and does
# NOT ignore RUSTSEC-2025-0134 (that entry never matched here). Re-evaluate
# the cxx ignore when cxx-qt ships a release compatible with a patched cxx.

[advisories]
ignore = [
    # cxx 1.0.194 `let_cxx_string!` unsound (uninitialized value; 2026-07-05).
    # We do NOT use that macro (grep-clean across gui/crates). cxx arrives
    # transitively via cxx-qt-lib/cxx-qt 0.7.3, whose generated bridge is
    # ABI-version-locked to this exact cxx — bumping cxx to 1.0.196 breaks
    # the cxx-qt link (undefined `cxxbridge1$194$…` symbols). Re-evaluate on
    # the next cxx-qt release that supports a patched cxx.
    "RUSTSEC-2026-0202",
]
