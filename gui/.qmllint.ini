; qmllint config for the CrossDesk QML tree.
;
; Goal: catch real syntax errors (typos, malformed bindings, broken
; expressions) without drowning in noise from CXX-Qt-registered
; types that qmllint doesn't see at lint time. The build-time
; cargo+CXX-Qt step is the source of truth for those types; here
; we only police what plain qmllint can verify standalone.
;
; MaxWarnings=0 turns the run into a strict gate: any enabled
; "warning"-level finding fails the lint.

[General]
DisableDefaultImports=false
MaxWarnings=0

[Warnings]
; --- Disabled because CXX-Qt-generated types are not in qmllint's
;     view; the cargo build catches mismatches authoritatively. ---
ImportFailure=disable
MissingProperty=disable
MissingType=disable
UnresolvedType=disable
UnqualifiedAccess=disable
PropertyAlreadyDefined=disable
; --- Layout-positioning rule is on by default (Qt default level
;     is "warning"). 2026-05-19 cleanup migrated the 51 raw width:/
;     height: assignments inside Layouts to Layout.preferredWidth /
;     Layout.preferredHeight; the gate now fails the lint on any
;     regression.
Quick.LayoutsPositioning=warning
; --- Real bugs we want to fail on (selection of the high-signal
;     defaults; everything not listed inherits qmllint defaults). ---
AccessSingletonViaObject=warning
AliasCycle=warning
AssignmentInCondition=warning
BadSignalHandlerParameters=warning
Comma=warning
ConfusingExpressionStatement=warning
ConfusingMinuses=warning
ConfusingPluses=warning
Deprecated=warning
DuplicateEnumEntries=warning
DuplicateImport=warning
DuplicatedName=warning
EqualityTypeCoercion=warning
Eval=warning
InheritanceCycle=warning
InvalidLintDirective=warning
LiteralConstructor=warning
NonListProperty=warning
NonRootEnum=warning
PrefixedImportType=warning
SignalHandlerSignature=warning
SyntaxErrorInEnumeration=warning
TypoInPropertyName=warning
UncreatableType=warning
UseProperFunction=warning
UseVarBeforeDeclaration=warning
With=warning
