[package]
name        = "crossdesk-gui"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "CrossDesk visual mock console (Rust + Qt6/QML)"

# `cxx` is used transitively by cxx-qt's macro expansion (the bridge
# modules in src/qobjects/{wizard,manager}.rs generate code that
# references cxx::*). cargo-machete can't see through macros so it
# reports the dep as unused; whitelist it.
[package.metadata.cargo-machete]
ignored = ["cxx"]

[[bin]]
name = "crossdesk-gui"
path = "src/main.rs"

[dependencies]
cxx        = { workspace = true }
cxx-qt     = { workspace = true }
cxx-qt-lib = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }

[dev-dependencies]
tempfile = "3"
